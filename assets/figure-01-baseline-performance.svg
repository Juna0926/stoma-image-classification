<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:23px;font-weight:700}.v{font-size:28px;font-weight:700;fill:#2563eb}.b{font-size:21px;fill:#475467}</style><text x="70" y="85" class="t">Baseline Model Performance</text><text x="70" y="125" class="s">Presentation-stage benchmark under stratified 5-fold evaluation</text><rect x="70" y="185" width="1060" height="360" rx="24" fill="#f8fafc" stroke="#d0d5dd"/><text x="120" y="250" class="h">Metric</text><text x="430" y="250" class="h">Decision Tree</text><text x="690" y="250" class="h">CNN</text><text x="915" y="250" class="h">EfficientNet-B0</text><line x1="110" y1="275" x2="1090" y2="275" stroke="#d0d5dd"/><text x="120" y="330" class="b">Accuracy</text><text x="430" y="330" class="b">0.5903</text><text x="690" y="330" class="b">0.5890</text><text x="915" y="330" class="v">0.8124</text><text x="120" y="395" class="b">AUC</text><text x="430" y="395" class="b">0.5928</text><text x="690" y="395" class="b">0.6769</text><text x="915" y="395" class="v">0.8919</text><text x="120" y="460" class="b">Recall</text><text x="430" y="460" class="b">0.5532</text><text x="690" y="460" class="b">0.6961</text><text x="915" y="460" class="v">0.8052</text><text x="120" y="525" class="b">F1</text><text x="430" y="525" class="b">0.5870</text><text x="690" y="525" class="b">0.6372</text><text x="915" y="525" class="v">0.8202</text><text x="70" y="610" class="s">Baseline AUC 0.8919 is kept distinct from the later optimized AUC 0.92.</text></svg>