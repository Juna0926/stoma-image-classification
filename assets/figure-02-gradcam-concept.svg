<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".15"/><stop offset=".5" stop-color="#f59e0b" stop-opacity=".45"/><stop offset="1" stop-color="#ef4444" stop-opacity=".75"/></linearGradient></defs><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:26px;font-weight:700}.b{font-size:21px;fill:#475467}</style><text x="70" y="85" class="t">Grad-CAM for Prediction Evidence</text><text x="70" y="125" class="s">Inspect where the classifier obtains the visual evidence supporting its decision</text><rect x="90" y="220" width="300" height="260" rx="24" fill="#f8fafc" stroke="#d0d5dd"/><text x="125" y="275" class="h">Input image</text><rect x="145" y="320" width="190" height="115" rx="18" fill="#e5e7eb"/><text x="188" y="385" class="b">image</text><path d="M410 350H505" stroke="#2563eb" stroke-width="7"/><path d="M495 335l25 15-25 15" fill="#2563eb"/><rect x="520" y="220" width="300" height="260" rx="24" fill="#eff6ff" stroke="#93c5fd"/><text x="555" y="275" class="h">Feature gradients</text><rect x="575" y="320" width="190" height="115" rx="18" fill="url(#g)"/><text x="610" y="385" class="b">activation map</text><path d="M840 350H935" stroke="#2563eb" stroke-width="7"/><path d="M925 335l25 15-25 15" fill="#2563eb"/><rect x="950" y="220" width="180" height="260" rx="24" fill="#fff7ed" stroke="#fdba74"/><text x="980" y="275" class="h">Interpretation</text><text x="980" y="335" class="b">Red / warm</text><text x="980" y="370" class="b">regions =</text><text x="980" y="405" class="b">higher model</text><text x="980" y="440" class="b">attention</text><text x="70" y="600" class="s">The project used Grad-CAM not only as an explanation tool, but as a diagnostic for deployment-related model bias.</text></svg>