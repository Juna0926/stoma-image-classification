<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:26px;font-weight:700}.b{font-size:21px;fill:#475467}</style><text x="70" y="85" class="t">Background Bias: Deployment Failure Mode</text><text x="70" y="125" class="s">High AUC does not guarantee that a medical-image model uses clinically relevant visual evidence</text><rect x="80" y="205" width="470" height="330" rx="26" fill="#fff7ed" stroke="#fdba74"/><text x="120" y="265" class="h">Spurious visual cue</text><rect x="120" y="305" width="390" height="120" rx="20" fill="#ffedd5"/><text x="160" y="360" class="b">surrounding gauze / acquisition context</text><text x="160" y="400" class="b">rather than the stoma ROI</text><text x="120" y="480" class="b">→ unstable generalization across capture settings</text><path d="M570 365H660" stroke="#2563eb" stroke-width="7"/><path d="M650 350l25 15-25 15" fill="#2563eb"/><rect x="680" y="205" width="440" height="330" rx="26" fill="#ecfdf3" stroke="#86efac"/><text x="720" y="265" class="h">Optimization direction</text><text x="720" y="330" class="b">1. ROI-centered preprocessing</text><text x="720" y="385" class="b">2. Label Smoothing</text><text x="720" y="440" class="b">3. Re-check attention after optimization</text><text x="720" y="495" class="b">Baseline AUC 0.8919 → optimized AUC 0.92</text><text x="70" y="610" class="s">Clinical Grad-CAM examples from the original presentation are intentionally not redistributed in this public repository.</text></svg>